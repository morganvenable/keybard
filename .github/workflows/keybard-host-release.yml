name: Package Keybard Host preview

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package (keybard-host-v* or a v* launch tag such as vLaunch2)
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^(keybard-host-v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?|v[A-Za-z0-9]+(\.[0-9]+)*)$ ]]'
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm test
      - run: PYTHONPATH=companion/overlay-host python -m unittest discover -s companion/overlay-host/tests -q
      - run: npm run build:svalboard
      - run: npm run build:paranoid
      - name: Package, stamped with the release and the Keybard commit it bundles
        env:
          KEYBARD_HOST_VERSION: ${{ inputs.tag }}
        run: |
          echo "KEYBARD_COMMIT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          KEYBARD_COMMIT=$(git rev-parse --short=7 HEAD) python companion/overlay-host/scripts/package.py
      - name: Release notes with this build's Keybard
        run: |
          cp companion/overlay-host/RELEASE-NOTES.md dist/RELEASE-NOTES.md
          {
            echo
            echo "## This build"
            echo
            echo "- Bundles Keybard \`$KEYBARD_COMMIT\`, the same build keybard.svalboard.com served at that commit (shown in the corner of the Keybard page)."
            echo "- Keybard Host reports its release and bundled Keybard in Trainer and in its tray tooltip."
          } >> dist/RELEASE-NOTES.md
      - name: Checksum
        working-directory: dist
        run: sha256sum KeybardHost-Windows.zip > SHA256SUMS.txt
      - name: Create draft preview release for Windows validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          cp dist-paranoid/keybard-paranoid.html dist/ &&
          (cd dist && sha256sum keybard-paranoid.html >> SHA256SUMS.txt) &&
          gh release create "$RELEASE_TAG" dist/KeybardHost-Windows.zip dist/keybard-paranoid.html dist/SHA256SUMS.txt
          --verify-tag --draft --prerelease --title "Keybard Host $RELEASE_TAG"
          --notes-file dist/RELEASE-NOTES.md
