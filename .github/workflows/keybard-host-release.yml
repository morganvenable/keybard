name: Package Keybard Host preview

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing keybard-host-v* tag to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^keybard-host-v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$ ]]'
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm test
      - run: PYTHONPATH=companion/overlay-host python -m unittest discover -s companion/overlay-host/tests -q
      - run: npm run build:svalboard
      - run: npm run build:paranoid
      - run: python companion/overlay-host/scripts/package.py
      - name: Checksum
        working-directory: dist
        run: sha256sum KeybardHost-Windows.zip > SHA256SUMS.txt
      - name: Create draft preview release for Windows validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          cp dist-paranoid/keybard-paranoid.html dist/ &&
          (cd dist && sha256sum keybard-paranoid.html >> SHA256SUMS.txt) &&
          gh release create "$RELEASE_TAG" dist/KeybardHost-Windows.zip dist/keybard-paranoid.html dist/SHA256SUMS.txt
          --verify-tag --draft --prerelease --title "Keybard Host $RELEASE_TAG"
          --notes-file companion/overlay-host/RELEASE-NOTES.md
