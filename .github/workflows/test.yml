name: Tests

# The full test suite: vitest with coverage on Node 22 and 24, Keybard
# Overlay's Python tests (with Qt, offscreen), and the Keybard Paranoid build
# (build/paranoid.ts fails it on any external reference).
#
# Releases run it before they deploy or publish anything (next-deploy.yml,
# svalboard-deploy.yml and keybard-overlay-release.yml call it on the tag).
# Pull requests and pushes don't run it; run it locally first, or by hand:
#
#   gh workflow run test.yml -R svalboard/keybard --ref <branch>

on:
  workflow_call:
    inputs:
      ref:
        description: The ref to test (a release tag); empty tests the run's commit
        required: false
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlay-host:
    # Keybard Overlay's Python tests, with Qt (offscreen) so the Qt tests run too.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Libraries Qt WebEngine needs
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libnss3 libasound2t64 libxkbfile1 libegl1 libxkbcommon0
    - run: pip install -r companion/overlay-host/requirements.txt
    - name: Python tests
      env:
        QT_QPA_PLATFORM: offscreen
        PYTHONPATH: companion/overlay-host
      run: python -m unittest discover -s companion/overlay-host/tests -v

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: All tests, with the coverage thresholds (vitest.config.ts)
      run: npm run test:coverage

  paranoid:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0
    - uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: npm
    - run: npm ci
    - name: Keybard Paranoid (no network references)
      run: npm run build:paranoid
