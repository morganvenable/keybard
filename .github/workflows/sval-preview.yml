name: Keybard Preview

on:
  push:
    branches: [cleanup/sval-naming]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sval-preview-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test -- tests/services/vial.service.test.ts tests/services/file.service.test.ts tests/utils/app-storage.test.ts tests/services/import.service.test.ts tests/services/layer-import.service.test.ts
      - run: npm run build:sval-preview
        env:
          GIT_BRANCH: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
      # Publish the production compatibility guard beside the working preview.
      # Pin its source so the deployed pair is reproducible.
      - uses: actions/checkout@v5
        with:
          ref: c2e205e2532bd409c0b5a71c14e9560805a998a8
          path: production-check-source
      - run: npm ci
        working-directory: production-check-source
      - run: npm test -- tests/services/firmware-compatibility.test.ts tests/services/vial.service.test.ts tests/contexts/sval-compatibility.test.tsx tests/utils/app-storage.test.ts
        working-directory: production-check-source
      - run: npx tsc && npx vite build --mode production-check
        working-directory: production-check-source
        env:
          GIT_BRANCH: fix/sval-preview-connection-guard
          GIT_SHA: c2e205e2532bd409c0b5a71c14e9560805a998a8
      - run: mv production-check-source/dist dist/production-check
      - uses: actions/upload-artifact@v4
        with:
          name: sval-preview-site
          path: dist
      - uses: actions/upload-pages-artifact@v3
        if: github.repository == 'morganvenable/keybard-sval-preview'
        with:
          path: dist

  deploy:
    # Pages replaces the entire site's content. Never deploy this job in the
    # production repository, including when the workflow is manually dispatched.
    if: github.repository == 'morganvenable/keybard-sval-preview' && github.ref == 'refs/heads/cleanup/sval-naming'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
