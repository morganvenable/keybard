# Build and deploy Vite app to GitHub Pages - Triggering deployment
name: Deploy Vite App to Pages

on:
  # Runs only on pushes to main when Vite source files change.
  # Pushes to other branches must NOT auto-deploy: GitHub Pages serves a
  # single URL, so without this restriction any branch push would race
  # with main and overwrite production. The job also checks main so a manual
  # dispatch of a preview branch cannot publish to the production site.
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "vite-pages"
  cancel-in-progress: false

jobs:
  # Build and deploy job
  build-and-deploy:
    # Production deployment is restricted to the production repository and branch.
    if: github.repository == 'morganvenable/keybard-ng' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Capture build metadata
        id: meta
        run: |
          {
            echo "branch=${{ github.ref_name }}"
            echo "sha=$(echo '${{ github.sha }}' | cut -c1-7)"
            echo "subject<<GHA_EOF"
            git log -1 --pretty=%s
            echo "GHA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Vite app
        env:
          GIT_BRANCH: ${{ steps.meta.outputs.branch }}
          GIT_SHA: ${{ steps.meta.outputs.sha }}
          GIT_SUBJECT: ${{ steps.meta.outputs.subject }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload dist folder from Vite build
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
