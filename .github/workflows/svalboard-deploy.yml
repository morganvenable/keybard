name: Deploy Keybard (keybard.svalboard.com)

# Production: served by GitHub Pages at the custom domain keybard.svalboard.com
# (set in the repository's Pages settings; a keybard CNAME on svalboard.com
# points at svalboard.github.io). Built for the domain's root with --mode
# svalboard (.env.svalboard).
#
# Production is promoted, not deployed on every merge: merges to main go to the
# bleeding-edge site (next-deploy.yml). Promote with the launch tag shared with
# the firmware and Keybard Host releases (e.g. vLaunch2), so one name means the
# same release everywhere. The tag must be on main:
#
#   gh workflow run svalboard-deploy.yml -R svalboard/keybard -f ref=<launch tag>

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Launch tag (or commit) on main to deploy, e.g. vLaunch2"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: svalboard-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'svalboard/keybard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Only deploy what is already on main
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::${{ inputs.ref }} is not on main"; exit 1; }
          echo "Deploying $(git log -1 --format='%h %s')"
      - id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:svalboard
        env:
          GIT_BRANCH: main
          GIT_SHA: ${{ steps.meta.outputs.sha }}
          GIT_SUBJECT: ${{ steps.meta.outputs.subject }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Pages replaces the whole site: deploy only from a run of this repository's main.
    if: github.repository == 'svalboard/keybard' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
